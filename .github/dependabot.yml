version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools", "/tools/goreleaser"]
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
