name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, test, build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/goreleaser/go.sum
      - name: FFmpeg build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/ffmpeg/*.tar.xz
            build/ffmpeg/out
            internal/ffmpeg/bin
          key: ffmpeg-${{ hashFiles('build/ffmpeg/Dockerfile', 'build/ffmpeg/configure-flags', 'Makefile') }}
      - run: make lint test test-embedded build
